name: Release

# Publishes the four packages to npm when a version tag is pushed:
#
#   git tag v5.3.3 && git push origin v5.3.3
#
# npm Trusted Publishing: npm accepts a short-lived OIDC credential from this workflow,
# so there is no npm token in the repository and no OTP. Each package on npmjs.com must
# list this repository, this workflow file (release.yml) and the environment "npm" as its
# trusted publisher.
#
# No provenance (--provenance=false): with Trusted Publishing, npm turns provenance on by
# default, and provenance requires package.json "repository.url" and shows a link to this
# repository on npmjs.com. The packages deliberately do not link to their source repository
# (see check:repolinks), and Trusted Publishing works without provenance.
#
# The "npm" environment requires a maintainer's approval, so nothing is published until a
# person approves the run in the Actions UI. That approval replaces the OTP.

on:
  push:
    tags: ['v*.*.*']

# One release at a time; a second tag waits instead of racing the first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: The tag matches the version of all four packages
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          status=0
          for p in stencil react vue angular; do
            v=$(node -p "require('./packages/$p/package.json').version")
            echo "packages/$p: $v"
            [ "$v" = "$TAG_VERSION" ] || { echo "::error::packages/$p is $v, the tag is $GITHUB_REF_NAME"; status=1; }
          done
          for p in react vue angular; do
            dep=$(node -p "require('./packages/$p/package.json').dependencies['@dubai-design-system/components-js']")
            [ "$dep" = "^$TAG_VERSION" ] || { echo "::error::packages/$p depends on components-js $dep, expected ^$TAG_VERSION"; status=1; }
          done
          exit $status

      - name: The tagged commit is on master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || {
            echo "::error::$GITHUB_SHA is not on master. Tag a commit on master."
            exit 1
          }

      # The CI workflow runs the unit, e2e, lint and accessibility checks on every push to
      # master. Release only a commit where all of it passed. When the tag is pushed with the
      # commit, CI is still running, so wait for it (at most 40 minutes).
      - name: CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 80); do
            RUN=$(gh run list --workflow CI --commit "$GITHUB_SHA" --event push --limit 1 --json status,conclusion --jq '.[0] // {} | "\(.status // "none") \(.conclusion // "")"')
            read -r STATUS CONCLUSION <<< "$RUN"
            echo "CI on $GITHUB_SHA: status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" = "completed" ]; then
              [ "$CONCLUSION" = "success" ] && exit 0
              echo "::error::CI failed on $GITHUB_SHA ($CONCLUSION). Fix it on master, then tag a green commit."
              exit 1
            fi
            [ "$STATUS" = "none" ] && [ "$i" -gt 10 ] && { echo "::error::No CI run found for $GITHUB_SHA."; exit 1; }
            sleep 30
          done
          echo "::error::CI did not finish within 40 minutes."
          exit 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      # The build does not run a browser; skip puppeteer's ~150MB Chromium download.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Install with the npm that ships with Node 22.14 (npm 10), as CI does. npm 11's
      # `npm ci` rejects this lockfile: it lacks the optional @swc/core platform packages.
      - name: Install
        run: npm ci --foreground-scripts

      # stencil first: its build generates the wrapper sources. `npm run build`, not
      # `npx stencil build`: the postbuild step appends the Dubai @font-face rules to
      # dist/dda/dda.css.
      - name: Build
        run: |
          (cd packages/stencil && npm run build)
          (cd packages/react && npm run build)
          (cd packages/vue && npm run build)
          (cd packages/angular && npm run build)

      - name: The stylesheet has the Dubai font rules
        run: |
          grep -q 'Generated by scripts/emit-font-css' packages/stencil/dist/dda/dda.css || {
            echo "::error::dist/dda/dda.css has no Dubai @font-face rules. Check the stencil postbuild step."
            exit 1
          }

      - name: The build matches the committed generated files
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::The build changed tracked files. Commit the rebuild before you tag."
            git status --porcelain --untracked-files=no
            exit 1
          fi

      # Trusted Publishing needs npm 11.5.1 or later. Updated only now, after the install.
      - name: Update npm
        run: npm install -g npm@^11.5.1 && npm --version

      # components-js first: the three wrappers depend on it. A version that is already on
      # npm is skipped, so a failed run can be re-run safely. --ignore-scripts: everything
      # is built above, and angular's prepublishOnly would build it again.
      - name: Publish
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for p in stencil react vue angular; do
            name=$(node -p "require('./packages/$p/package.json').name")
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION is already on npm; skipped."
              continue
            fi
            (cd "packages/$p" && npm publish --ignore-scripts --access public --provenance=false)
          done
