<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search results</title>
    <!-- Styles, fonts and scripts start in <head>. style.css shows a spinner until setup.js marks the page ready. -->
    <link rel="stylesheet" href="/style.css">
    <link rel="preload" href="/node_modules/@dubai-design-system/components-js/dist/assets/fonts/dubai/DubaiRegular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/node_modules/@dubai-design-system/components-js/dist/assets/fonts/dubai/DubaiMedium.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/node_modules/@dubai-design-system/components-js/dist/assets/fonts/dubai/DubaiBold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=block" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
    <!-- search.js adds the result cards, then loads setup.js, so setup.js loads the card component too. -->
    <script type="module" src="/search.js"></script>
  </head>
  <body>
    <a class="demo-skip-link" href="#main">Skip to main content</a>
    <dda-header id="site-header" language_text="العربية" login-link="#"></dda-header>

    <main id="main" tabindex="-1" class="demo-main">
      <div>
        <h1>Search results</h1>
        <p id="search-summary"></p>
      </div>

      <div id="search-results" class="demo-grid"></div>
    </main>

    <dda-footer id="site-footer" footer-title="Footer title placeholder" description="Footer description placeholder." copyright-text="© 2026 Placeholder. All rights reserved." sign-up-button-text="Sign up" login-button-text="Login"></dda-footer>

    <dda-sticky-footer id="site-sticky-footer"></dda-sticky-footer>
  </body>
</html>
