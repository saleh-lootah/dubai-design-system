<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact us</title>
    <!-- Styles, fonts and scripts start in <head>. style.css shows a spinner until setup.js marks the page ready. -->
    <link rel="stylesheet" href="/style.css">
    <link rel="preload" href="/node_modules/@dubai-design-system/components-js/dist/assets/fonts/dubai/DubaiRegular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/node_modules/@dubai-design-system/components-js/dist/assets/fonts/dubai/DubaiMedium.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/node_modules/@dubai-design-system/components-js/dist/assets/fonts/dubai/DubaiBold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=block" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
    <script type="module" src="/contact.js"></script>
  </head>
  <body>
    <a class="demo-skip-link" href="#main">Skip to main content</a>
    <dda-header id="site-header" language_text="العربية" login-link="#"></dda-header>

    <main id="main" tabindex="-1" class="demo-main">
      <dda-breadcrumb breadcrumbs='[{"text":"Home","url":"./"},{"text":"Contact"}]'></dda-breadcrumb>

      <div class="demo-page-intro">
        <h1>Contact us</h1>
        <p>Send us a message, or use the details below. This is a sample page: nothing is sent.</p>
      </div>

      <section class="demo-columns demo-columns-top">
        <form id="contact-form" class="demo-form">
          <h2>Send a message</h2>
          <dda-alert id="contact-sent" hidden heading_level="3" variation="success" type="primary" title_text="Message sent" description="Thank you. This is a sample form, so nothing was sent."></dda-alert>
          <dda-input label="Full name" placeholder="Full name" input_id="contact-name" input_name="name"></dda-input>
          <dda-input label="Email" type="email" placeholder="name@example.com" input_id="contact-email" input_name="email"></dda-input>
          <dda-phonefield label="Phone"></dda-phonefield>
          <dda-select label="Topic" options='["General question","Feedback about a service","Technical problem"]'></dda-select>
          <dda-textarea label="Message" placeholder="How can we help?" input_id="contact-message" textarea_name="message"></dda-textarea>
          <dda-checkbox title_text="I agree that you can contact me about this message" input_id="contact-consent"></dda-checkbox>
          <div class="demo-row">
            <dda-button button_color="default-primary" type="submit" end_icon="send">Send message</dda-button>
          </div>
        </form>

        <div class="demo-form">
          <h2>Contact details</h2>
          <dda-ui-card maintitle="Call us" subtitle="800 0000 (placeholder), Sunday to Thursday, 8:00 to 16:00" icon="call"></dda-ui-card>
          <dda-ui-card maintitle="Email" subtitle="hello@example.com (placeholder)" icon="mail"></dda-ui-card>
          <dda-ui-card maintitle="Visit us" subtitle="Placeholder Street 1, Dubai" icon="location_on"></dda-ui-card>
          <img class="demo-hero-media" src="https://placehold.co/1280x720?text=Map" alt="Map placeholder" />
        </div>
      </section>
    </main>

    <dda-footer id="site-footer" footer-title="Footer title placeholder" description="Footer description placeholder." copyright-text="© 2026 Placeholder. All rights reserved." sign-up-button-text="Sign up" login-button-text="Login"></dda-footer>

    <dda-sticky-footer id="site-sticky-footer"></dda-sticky-footer>
  </body>
</html>
